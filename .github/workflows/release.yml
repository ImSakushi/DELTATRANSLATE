name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de la release à remplacer
        required: true
        default: v1.2.0

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }} (${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, bundled]
        platform:
          - name: Windows
            os: windows-latest
            command: npm run dist:win
          - name: macOS
            os: macos-latest
            command: npm run dist:mac
          - name: Linux
            os: ubuntu-latest
            command: npm run dist:linux
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Préparer les outils de vérification
        run: npm run prepare:tools
      - name: Vérifier la version du tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - name: Vérifier les tests avant distribution
        run: npm test
      - name: Construire les livrables
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DELTATRANSLATE_EDITION: ${{ matrix.edition }}
        run: ${{ matrix.platform.command }}
      - name: Archiver les livrables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-${{ matrix.edition }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/bundled*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Remplacer la release avec les deux éditions
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Fournir les sources Git
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/git/git/archive/67ad42147a7acc2af6074753ebd03d904476118f.tar.gz -o release-assets/git-2.53.0-sources.tar.gz
          curl --fail --location --retry 3 https://github.com/git-for-windows/git/archive/refs/tags/v2.53.0.windows.4.tar.gz -o release-assets/git-windows-2.53.0.4-sources.tar.gz
          curl --fail --location --retry 3 https://github.com/desktop/dugite-native/archive/refs/tags/v2.53.0-4.tar.gz -o release-assets/dugite-native-build-sources.tar.gz
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vérifier les canaux et les fichiers publiés
        run: |
          npm ci --ignore-scripts
          node scripts/verify-release.cjs release-assets
      - name: Générer les sommes SHA-256
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publier les deux éditions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: DELTATRANSLATE ${{ inputs.release_tag || github.ref_name }} - Standard et Git intégré
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: false
          make_latest: true
